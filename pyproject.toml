[project]
name = "mcp-inspector"
version = "0.1.0"
description = "Project description here"
readme = "README.md"
authors = [{ name = "Eren Irmak", email = "irmak.eren@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.2",
    "flask-socketio>=5.6.0",
    "mcp>=1.26.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]



[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
lint = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
]

[tool.ruff]
line-length = 112

[tool.ruff.lint]
select = ["I"] # Keeps the import sorting rule from hf-mem
